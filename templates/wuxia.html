<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🏯 江湖经营</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Serif SC",serif;background:#0a0a12;color:#d4c9a8;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(135deg,#1a1410,#0f0d0a);border-bottom:1px solid #3a3020;padding:8px 14px;position:sticky;top:0;z-index:20}
.leaderboard-btn{padding:2px 10px;border-radius:4px;border:1px solid #8a6a20;background:rgba(255,215,0,.08);color:#ffd700;font-size:11px;cursor:pointer;font-family:inherit;transition:all .2s}
.leaderboard-btn:hover{background:rgba(255,215,0,.2)}
.lb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center}
.lb-panel{background:#12100e;border:1px solid #3a3020;border-radius:12px;padding:20px 16px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto}
.lb-title{text-align:center;font-size:18px;font-weight:700;color:#ffd700;margin-bottom:12px}
.lb-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1a1814;font-size:12px}
.lb-rank{width:28px;text-align:center;font-weight:700;font-size:14px}
.lb-rank.r1{color:#ffd700;font-size:18px}.lb-rank.r2{color:#c0c0c0}.lb-rank.r3{color:#cd7f32}
.lb-name{flex:1;color:#d4c9a8;font-weight:600}
.lb-power{color:#ffd700;font-weight:600;font-family:monospace}
.lb-stage{color:#5a4a3a;font-size:10px;width:40px;text-align:right}
.lb-me{background:rgba(255,215,0,.1)}
.header-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.game-title{font-size:15px;font-weight:700;color:#e8d5a3;letter-spacing:1px}
.res-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:#6a5a4a;flex-wrap:wrap}
.pity-bar{display:flex;gap:2px}.pity-dot{width:7px;height:7px;border-radius:50%}
.pity-done{background:#5adb7a}.pity-empty{background:#1a1a24;border:1px solid #2a2a3a}
.pity-gold{background:#ffd700;box-shadow:0 0 6px rgba(255,215,0,.5)}
.main{max-width:720px;margin:0 auto;padding:10px 12px 40px}
.msg-box{background:#12100e;border:1px solid #2a2218;border-radius:8px;padding:10px 14px;font-size:12px;color:#c4b89a;margin-bottom:10px;min-height:36px}
.info-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.info-card{flex:1;background:linear-gradient(180deg,#12100e,#0d0b09);border:1px solid #2a2218;border-radius:8px;padding:10px 12px;text-align:center;min-width:100px}
.info-card .l{font-size:10px;color:#6a5a4a}
.info-card .v{font-size:18px;font-weight:700;margin-top:2px}
.info-card .v.gold{color:#ffd700}.info-card .v.green{color:#5adb7a}
.bond-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.bond-tag{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(90,219,122,.1);border:1px solid rgba(90,219,122,.3);color:#5adb7a}
.bond-empty{font-size:10px;color:#3a2a3a}
.lineup-title{font-size:12px;color:#6a5a4a;margin-bottom:6px}
.lineup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
@media(max-width:500px){.lineup-grid{grid-template-columns:repeat(2,1fr)}}
.hero-card{border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;background:#12100e;min-height:80px;position:relative}
.hero-card:hover{transform:translateY(-2px)}
.hero-card .h-class{font-size:10px;opacity:.7;margin-bottom:1px}
.hero-card .h-name{font-size:12px;font-weight:600;color:#d4c9a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-card .h-level{font-size:9px;color:#6a5a4a;font-weight:400}
.hero-card .h-power{font-size:11px;font-weight:600;margin-top:4px}
.hero-card .h-lv{position:absolute;top:6px;right:8px;font-size:10px;opacity:.6}
.mini-btn{font-size:9px;padding:2px 6px;border-radius:4px;border:1px solid #4a8eff;background:transparent;color:#4a8eff;cursor:pointer;font-family:inherit;line-height:1}
.mini-btn:hover{background:rgba(74,142,255,.15)}
.consume-btn{background:#b84aff;color:#fff;border-color:#b84aff!important}
/* Exp bar */
.exp-bar{width:100%;height:14px;border-radius:7px;background:#1a1816;border:1px solid #2a2218;position:relative;margin:4px 0;overflow:hidden}
.exp-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#4a8eff,#6ab0ff);transition:width .3s}
.exp-text{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.action-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
@media(max-width:500px){.action-row{grid-template-columns:repeat(3,1fr)}}
.action-btn{padding:10px;border-radius:8px;border:1px solid #2a2218;background:linear-gradient(180deg,#12100e,#0d0b09);color:#d4c9a8;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.action-btn:hover{border-color:#5a4a3a;background:#1a1612;transform:translateY(-1px)}
.action-btn.gacha{background:linear-gradient(135deg,#3a2a10,#5a3a10);border-color:#8a6a20;color:#ffd700;font-weight:700}
.action-btn.battle{background:linear-gradient(135deg,#b84aff,#8a2be2);border-color:#b84aff;color:#fff}
.action-btn.battle:hover{box-shadow:0 0 20px rgba(184,74,255,.4)}
.action-btn.auto-battle{background:linear-gradient(135deg,#4a8eff,#1a6aff);border-color:#4a8eff;color:#fff}
.action-btn.auto-battle:hover{box-shadow:0 0 20px rgba(74,142,255,.4)}
.action-btn .ab-icon{font-size:18px;display:block}
.action-btn .ab-label{font-size:10px;opacity:.7}
.inv-section{margin-top:8px}
.inv-toggle{font-size:11px;color:#5a4a3a;cursor:pointer;text-align:center;padding:6px;border:1px dashed #2a2218;border-radius:6px}
.inv-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px;margin-top:6px}
.inv-grid.open{display:grid}
.inv-hero{padding:8px;border-radius:6px;border:1px solid #2a2218;cursor:pointer;font-size:11px;transition:all .15s;background:#12100e}
.inv-hero .iq{font-size:9px;font-weight:700}.inv-hero .in{font-size:12px;font-weight:600}.inv-hero .ip{font-size:10px;color:#5adb7a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:400;padding:16px}
.modal-inner{background:#12100e;border:1px solid #3a3020;border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto}
.hd-title{font-size:18px;font-weight:700}.hd-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.hd-stat{border:1px solid #2a2218;border-radius:6px;padding:6px 10px;font-size:12px;background:#0d0b09}
.hd-stat .sv{font-weight:700;font-size:16px}.hd-section{margin-bottom:10px}
.hd-section-title{font-size:12px;color:#8a7a5a;font-weight:600;margin-bottom:4px;border-bottom:1px solid #2a2218}
.hd-skill{font-size:12px;line-height:1.6}.hd-upgrade{font-size:11px;color:#5adb7a;margin:2px 0;padding:2px 6px;border-left:2px solid #5adb7a}
.equip-slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.equip-slot{border:1px solid #2a2218;border-radius:6px;padding:8px;text-align:center;cursor:pointer;background:#0d0b09;font-size:11px}
.pull-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300}
.pull-card{text-align:center;animation:pullIn .5s ease}
@keyframes pullIn{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pull-rarity{font-size:16px;font-weight:700;letter-spacing:6px}
.pull-icon{font-size:64px;margin:8px 0}.pull-name{font-size:26px;font-weight:700}
.pull10-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:450px;margin:0 auto}
.pull10-item{text-align:center;padding:8px;border-radius:6px;border:1px solid #2a2218;animation:pullPop .3s ease backwards}
@keyframes pullPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.pull-btn{margin-top:16px;padding:8px 28px;border-radius:8px;border:1px solid #3a3020;background:#1a1410;color:#d4c9a8;font-size:13px;cursor:pointer;font-family:inherit}
/* ── 神卡特效 ── */
.pull-god-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(255,51,51,.15) 0%,rgba(0,0,0,.97) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:310;cursor:pointer}
.pull-god-flash{position:fixed;inset:0;background:#fff;z-index:305;pointer-events:none}
.pull-god-flash1{animation:godFlash1 .2s ease forwards}
.pull-god-flash2{animation:godFlash2 .4s ease forwards}
@keyframes godFlash1{0%{opacity:.9}100%{opacity:0}}
@keyframes godFlash2{0%{opacity:.6}100%{opacity:0}}
.pull-god-card{text-align:center;animation:godReveal .7s cubic-bezier(.17,.67,.43,1.15) forwards;filter:drop-shadow(0 0 40px rgba(255,51,51,.8)) drop-shadow(0 0 80px rgba(255,51,51,.4))}
@keyframes godReveal{0%{transform:scale(0.1) rotate(-1080deg) translateY(-200px);opacity:0}30%{transform:scale(1.5) rotate(30deg) translateY(0);opacity:1}55%{transform:scale(.9) rotate(-8deg)}72%{transform:scale(1.1) rotate(3deg)}85%{transform:scale(.98) rotate(-1deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
.pull-god-glow{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,51,51,.5),rgba(255,51,51,.1) 40%,transparent 70%);animation:godPulse 1.2s ease-in-out infinite;pointer-events:none}
@keyframes godPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.8);opacity:1}}
.pull-god-rarity{font-size:36px;font-weight:900;letter-spacing:8px;animation:godShine .8s ease-in-out infinite;text-shadow:0 0 20px currentColor,0 0 40px currentColor,0 0 80px currentColor}
@keyframes godShine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.8)}}
.pull-god-icon{font-size:96px;margin:4px 0;animation:godFloat 1.5s ease-in-out infinite}
@keyframes godFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.05)}}
.pull-god-name{font-size:40px;font-weight:900;letter-spacing:4px;text-shadow:0 0 30px currentColor,0 0 60px currentColor,0 0 90px rgba(255,51,51,.5)}
.pull-god-sub{font-size:14px;color:#8a7a5a;margin-top:8px;animation:godFadeIn 1s ease .6s both}
@keyframes godFadeIn{0%{opacity:0}100%{opacity:1}}
/* 神卡冲击波 */
.pull-god-shockwave{position:fixed;top:50%;left:50%;width:20px;height:20px;border:3px solid rgba(255,51,51,.8);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:308;animation:godShockwave .8s ease-out forwards}
@keyframes godShockwave{0%{width:20px;height:20px;opacity:1;border-width:3px}100%{width:120vw;height:120vw;opacity:0;border-width:1px}}
.pull-god-shockwave2{position:fixed;top:50%;left:50%;width:20px;height:20px;border:2px solid rgba(255,215,0,.6);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:307;animation:godShockwave2 1s ease-out forwards}
@keyframes godShockwave2{0%{width:20px;height:20px;opacity:1}100%{width:160vw;height:160vw;opacity:0}}
/* 神卡星爆粒子 */
.pull-god-burst{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:315;animation:godBurst 1.2s ease-out forwards}
.pull-god-burst:nth-child(even){width:3px;height:3px}
@keyframes godBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(0)}}
/* 神卡屏幕边缘光柱 */
.pull-god-beam{position:fixed;background:linear-gradient(to top,transparent,rgba(255,51,51,.3),transparent);pointer-events:none;z-index:304;animation:godBeam .5s ease-out forwards}
@keyframes godBeam{0%{opacity:0;transform:scaleY(0)}30%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
/* 神卡旋转描边 */
.pull-god-border{position:absolute;inset:-8px;border:2px solid transparent;border-radius:16px;background:conic-gradient(from 0deg,transparent,rgba(255,51,51,.6),rgba(255,215,0,.6),rgba(255,51,51,.6),transparent);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));animation:godBorderSpin 2s linear infinite;pointer-events:none}
@keyframes godBorderSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

/* ── Battle ── */
.battle-overlay{position:fixed;inset:0;background:rgba(5,5,10,.96);display:none;flex-direction:column;align-items:center;z-index:250;padding:8px;overflow-y:auto}
.battle-title{font-size:14px;font-weight:700;color:#ffd700;margin:4px 0;text-align:center}
/* Speed control */
.speed-control{display:flex;gap:6px;margin:2px 0 4px}
.speed-btn{padding:2px 12px;border-radius:4px;border:1px solid #2a2218;background:#0d0b09;color:#6a5a4a;font-size:11px;cursor:pointer;font-family:inherit}
.speed-btn.active{background:rgba(255,215,0,.15);border-color:#ffd700;color:#ffd700}
.battle-field{display:flex;gap:10px;justify-content:center;align-items:flex-start;width:100%;max-width:600px}
.battle-side{flex:1;min-width:140px;max-width:280px}
.battle-side-label{font-size:10px;color:#6a5a4a;margin-bottom:3px;text-align:center}
.bc{display:flex;flex-direction:column;gap:2px}
.bc-card{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:5px;border:1px solid #2a2218;background:#0d0b09;transition:all .3s;font-size:10px;position:relative;min-height:34px}
.bc-card.bc-attack{animation:bcAttack .4s ease;border-color:#ffd700!important;box-shadow:0 0 10px rgba(255,215,0,.4)!important}
.bc-card.bc-hit{animation:bcHit .3s ease}.bc-card.bc-heal{animation:bcHeal .35s ease}
.bc-card.bc-dead{opacity:.2}
.bc-pos{display:inline-block;background:rgba(255,215,0,.15);color:#ffd700;font-size:8px;font-weight:700;padding:0 4px;border-radius:3px;margin-right:2px}
.bc-lv9{display:inline-block;background:#b84aff;color:#fff;font-size:7px;font-weight:800;padding:0 5px;border-radius:2px;margin-right:3px;letter-spacing:1px;cursor:help}
@keyframes bcAttack{0%{transform:scale(1)}35%{transform:scale(1.06);border-color:#ffd700}100%{transform:scale(1)}}
@keyframes bcHit{0%{border-color:#e85a5a;background:rgba(232,90,90,.15)}100%{border-color:#2a2218;background:#0d0b09}}
@keyframes bcHeal{0%{border-color:#5adb7a;background:rgba(90,219,122,.12);box-shadow:0 0 8px rgba(90,219,122,.3)}100%{border-color:#2a2218;background:#0d0b09}}
.bc-icon{font-size:13px;flex-shrink:0}.bc-info{flex:1;min-width:0}.bc-name{font-weight:600;font-size:10px}.bc-class{font-size:7px;color:#6a5a4a}
/* 敌方技能面板 */
.bc-skill-panel{width:140px;flex-shrink:0;background:#0d0b09;border:1px solid #2a1a1a;border-radius:6px;padding:6px 8px;font-size:10px;max-height:300px;overflow-y:auto}
.bc-skill-panel .sp-title{font-size:9px;color:#e85a5a;font-weight:600;margin-bottom:4px;text-align:center;border-bottom:1px solid #2a1a1a;padding-bottom:3px}
.bc-skill-panel .sp-row{display:flex;gap:4px;padding:3px 0;border-bottom:1px solid #1a0a0a;cursor:pointer;transition:all .15s}
.bc-skill-panel .sp-row:hover{background:rgba(232,90,90,.05)}
.bc-skill-panel .sp-row.sp-highlight{background:rgba(232,90,90,.1);border-left:2px solid #e85a5a;padding-left:4px}
.bc-skill-panel .sp-icon{font-size:11px;flex-shrink:0;width:16px;text-align:center}
.bc-skill-panel .sp-info{flex:1;min-width:0}
.bc-skill-panel .sp-name{font-size:9px;font-weight:600;color:#d4c9a8}
.bc-skill-panel .sp-desc{font-size:8px;color:#6a5a4a;line-height:1.3}
.bc-skill-panel .sp-passive{color:#ff3333;font-size:8px}
.bc-hp-strip{position:relative;height:4px;background:#1a1a24;border-radius:2px;overflow:hidden;margin-top:1px}
.bc-hp-fill{height:100%;border-radius:2px;transition:width .35s ease}
.bc-shield{position:absolute;top:0;right:0;height:100%;background:rgba(74,142,255,.4);border-radius:2px;transition:width .35s ease}
.bc-dmg-num{position:absolute;top:-5px;left:50%;transform:translateX(-50%);font-weight:700;font-size:14px;font-family:monospace;pointer-events:none;animation:dmgFloat .9s ease forwards;z-index:10;text-shadow:0 0 6px currentColor}
@keyframes dmgFloat{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-30px) scale(1.3)}}
.bc-dmg-num.ally-c{color:#ff8a4a}.bc-dmg-num.enemy-c{color:#e85a5a}.bc-dmg-num.crit-c{color:#ffd700;font-size:20px}.bc-dmg-num.heal-c{color:#5adb7a}

/* ── 正反馈+Buff显示 ── */
.bc-buffs{display:flex;gap:2px;flex-wrap:wrap;margin-top:1px}
.bc-buff{font-size:7px;padding:1px 4px;border-radius:3px;white-space:nowrap;line-height:1.2}
.bc-buff.positive{color:#5adb7a;background:rgba(90,219,122,.1)}
.bc-buff.negative{color:#e85a5a;background:rgba(232,90,90,.1)}
.bc-buff.ultimate{color:#ffd700;background:rgba(255,215,0,.15);font-size:8px;font-weight:700}
.bc-shield-icon{display:inline-block;font-size:9px;color:#4a8eff;margin-left:2px;animation:shieldPulse 1s ease infinite}
@keyframes shieldPulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}

/* 技能慢放 */
.skill-popup.skill-big{font-size:52px;animation:spBig 1.2s ease forwards}
@keyframes spBig{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(-15deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}40%{transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1.1)}}
.skill-popup.skill-big .s-icon{font-size:56px;display:block;margin-bottom:4px}
.skill-popup.skill-big .s-name{font-size:26px;text-shadow:0 0 40px currentColor,0 0 80px rgba(255,215,0,.3)}
.skill-popup.skill-big .s-sub{font-size:12px;opacity:.7;margin-top:2px}

/* 治疗爆发 */
.heal-burst{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:270;pointer-events:none;font-size:48px;font-weight:900;color:#5adb7a;text-shadow:0 0 40px rgba(90,219,122,.5),0 0 80px rgba(90,219,122,.3);animation:healBurst 1s ease forwards}
@keyframes healBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}40%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.2)}}

/* 闪屏加强 */
.sfx-skill{animation:sfxSkill .8s ease forwards}
@keyframes sfxSkill{0%{opacity:.8}60%{opacity:.3}100%{opacity:0}}
.sfx-skill-red{background:radial-gradient(ellipse at center,rgba(255,138,74,.5),transparent 60%)}
.sfx-skill-gold{background:radial-gradient(ellipse at center,rgba(255,215,0,.7),transparent 60%)}
.sfx-skill-green{background:radial-gradient(ellipse at center,rgba(90,219,122,.5),transparent 60%)}
.bc-energy-strip{height:4px;background:#2a2a3a;border-radius:2px;margin-top:1px;overflow:hidden;position:relative;border:1px solid #3a3a4a;min-height:6px}
.bc-energy-fill{height:100%;background:linear-gradient(90deg,#4a8eff,#6ab0ff);border-radius:2px;transition:width .25s ease;min-width:2%}
.bc-energy-ready .bc-energy-fill{background:linear-gradient(90deg,#ffd700,#ff8a4a);animation:energyPulse .8s ease infinite}
@keyframes energyPulse{0%,100%{opacity:.7}50%{opacity:1;box-shadow:0 0 6px rgba(255,215,0,.5)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.bc-energy-num{font-size:9px;font-weight:600;color:#4a8eff;margin-left:2px}
.bc-energy-ready .bc-energy-num{color:#ffd700}

/* ── Action Queue ── */

function playActionsBatch(acts,callback){
  if(!acts||!acts.length){if(callback)callback();return}
  let idx=0;
  function playNext(){
    if(idx>=acts.length){if(callback)callback();return}
    const act=acts[idx];
    updateActionQueue(acts,idx);
    updateStats(act);
    updateCardEnergy(act);
    updateCardStats(act);
    if(act.type==="passive"){
      handlePassiveAction(act);idx++;setTimeout(playNext,Math.round(600/Math.max(1,battleSpeed)));return;
    }
    if(act.type==="basic"||act.type==="skill"){
      const isSkill=act.type==="skill";
      const icon=isSkill?"⚡":"🗡️";
      const hitTag=act.total_hits>1?`【${act.hit_no}/${act.total_hits}】`:"";
      let lt="";
      if(act.side==="heal"){
        if(act.aoe&&act.targets)lt=`${hitTag}💚 ${act.attacker_name}${act.skill}(群奶)❤️${act.targets.reduce((s,t)=>s+(t.heal||0),0)}`;
        else lt=`${hitTag}💚 ${act.attacker_name}${act.skill}→❤️+${act.heal}`;
      }else if(act.aoe&&act.targets){
        const totalAoe=act.targets.map(t=>`${t.name}-${t.damage||0}${t.crit?"⭐":""}`).join(" ");
        lt=`${hitTag}${act.side==="ally"?icon:"💀"}${act.attacker_name}${act.skill} ${totalAoe}`;
      }
      else lt=`${hitTag}${act.side==="ally"?icon:"💀"}${act.attacker_name}${act.skill}→${act.target_name}💥${act.damage}${act.crit?"⭐":""}`;
      const ld=document.createElement("div");ld.className="bl-line";ld.textContent=lt;
      document.getElementById("battleLogT").appendChild(ld);
      document.getElementById("battleLogT").scrollTop=document.getElementById("battleLogT").scrollHeight;
      document.getElementById("roundIndicator").textContent=act.side==="ally"?icon+" 我方":act.side==="heal"?"💚 治疗":"💀 敌方";
      animateAct(act,()=>{idx++;setTimeout(playNext,Math.round(50/Math.max(1,battleSpeed)))});
      return;
    }
    idx++;playNext();
  }
  playNext();
}

    buffNotify(act.buff_effects.map(b=>bLabels[b]||b).join(" "),"#5adb7a");

}

// ═══ Stats tracking ═══
const liveStats={dmg:{},heal:{},taken:{},bestHit:{name:"",val:0},crits:0};
function updateStats(act){
  if(act.type==="card_play"||act.type==="passive")return;
  if(act.side==="ally"){
    const dmg=act.aoe&&act.targets?act.targets.reduce((s,t)=>s+(t.damage||0),0):(act.damage||0);
    if(dmg>0){liveStats.dmg[act.attacker_name]=(liveStats.dmg[act.attacker_name]||0)+dmg;
      if(dmg>liveStats.bestHit.val)liveStats.bestHit={name:act.attacker_name,val:dmg};}
    if(act.crit)liveStats.crits++;
  }
  if(act.side==="heal"){
    const heal=act.aoe&&act.targets?act.targets.reduce((s,t)=>s+(t.heal||0),0):(act.heal||0);
    if(heal>0)liveStats.heal[act.attacker_name]=(liveStats.heal[act.attacker_name]||0)+heal;
  }
  if(act.damage>0){
    if(act.aoe&&act.targets){for(let tg of act.targets){if(tg.name)liveStats.taken[tg.name]=(liveStats.taken[tg.name]||0)+(tg.damage||0);}}
    else if(act.target_name){liveStats.taken[act.target_name]=(liveStats.taken[act.target_name]||0)+act.damage;}
  }
  renderStatsPanel(liveStats);
}

function updateActionQueue(aa,ti){
  const aq=document.getElementById("actionQueue");
  if(aa&&aa.length>0&&ti!==undefined){
    let h=`<span class="aq-label">⏱️牌轴</span>`;
    const endIdx=Math.min(ti+5,aa.length);

      const a=aa[j];const nm=a.attacker_name||"";
      const isNext=j===ti?" aq-next":"";
      let cls="aq-item";
      if(a.type==="card_play")cls+=" aq-card";
      else if(a.side==="ally")cls+=" aq-ally";
      else if(a.side==="enemy")cls+=" aq-enemy";
      else if(a.side==="heal")cls+=" aq-heal";
      const icon=a.type==="card_play"?"🎴":a.type==="skill"?"⚡":"🗡️";
      h+=`<div class="${cls}${isNext}">${icon}${nm.slice(0,4)}</div>`;
    }
    aq.innerHTML=h;
  }else{aq.innerHTML=""}
}

// ═══ Buff标记实时更新 ═══
function updateCardBuffs(act){
  if(act.type==="card_play")return;
  if(act.side==="heal"||act.side==="ally"){
    // 更新所有我方卡片的buff标签
    const myCards=document.querySelectorAll("#bc-my .bc-card");
    // 从battle result取最新buff数据
    const br=window._lastBr;
    if(!br||!br.my_heroes)return;
    for(let i=0;i<myCards.length&&i<br.my_heroes.length;i++){
      const h=br.my_heroes[i];
      const c=myCards[i];
      if(!c||!h)continue;
      // 更新eff_atk/eff_crit显示
      const infoLine=c.querySelector(".bc-info>div:not(.bc-name):not(.bc-class)");
      if(infoLine){
        const baseAtk=h.atk||0;
        const effAtk=h.eff_atk||baseAtk;
        if(effAtk!==baseAtk){
          let html=infoLine.innerHTML;
          // Replace atk display
          html=html.replace(/⚔️\d+/,`⚔️${effAtk}`);
          html=html.replace(/\(\d+\)/g,`(${baseAtk})`);
          infoLine.innerHTML=html;
        }
      }
      // 更新buff标签
      const existingBuffs=c.querySelector(".bc-buffs");
      if(existingBuffs){
        const tags=[];
        for(let b of h.buffs||[]){
          if(b==="immune")tags.push('<span class="bc-buff ultimate">🛡️免疫</span>');
          else if(b==="atk")tags.push('<span class="bc-buff positive">⚔️+攻</span>');
          else if(b==="dmg_reduce")tags.push('<span class="bc-buff positive">🛡️减伤</span>');
          else if(b==="lifesteal")tags.push('<span class="bc-buff positive">💉吸血</span>');
          else if(b==="reflect")tags.push('<span class="bc-buff positive">🔄反伤</span>');
          else if(b==="spd")tags.push('<span class="bc-buff positive">👟加速</span>');
          else tags.push(`<span class="bc-buff positive">${b}</span>`);
        }
        for(let d of h.debuffs||[]){
          if(d==="burn")tags.push('<span class="bc-buff negative">🔥灼烧</span>');
          else if(d==="stun"||d==="freeze")tags.push('<span class="bc-buff negative">💀眩晕</span>');
          else if(d==="heal_block")tags.push('<span class="bc-buff negative">🚫禁疗</span>');
          else if(d==="atk")tags.push('<span class="bc-buff negative">⬇️攻-</span>');
          else tags.push(`<span class="bc-buff negative">${d}</span>`);
        }
        existingBuffs.innerHTML=tags.slice(0,5).join("");
        // 圣盾图标
        const nm=c.querySelector(".bc-name");
        if(nm&&h.buffs&&h.buffs.includes("immune")){
          if(!nm.innerHTML.includes("🛡️"))nm.innerHTML+=' <span class="bc-shield-icon">🛡️</span>';
        }
      }
    }
  }
}

// ═══ 实时更新卡片攻暴+状态(每步都调用) ═══
function updateCardStats(act){
  if(act.type==="card_play")return;
  if(act.hero_eff_atk===undefined)return;
  const side=act.side==="heal"||act.side==="ally"?"my":"";
  const allCards=document.querySelectorAll(`#bc-${side||"my"} .bc-card`);
  for(let c of allCards){
    const nm=c.querySelector(".bc-name");
    if(!nm||!nm.textContent.startsWith(act.attacker_name))continue;
    // 更新攻暴数字
    const info=c.querySelector(".bc-info>div:not(.bc-name):not(.bc-class)");
    if(info){
      const baseAtk=act.hero_base_atk||act.hero_eff_atk;
      const baseCrit=act.hero_base_crit||act.hero_eff_crit;
      const atkDiff=act.hero_eff_atk!==baseAtk;
      const critDiff=act.hero_eff_crit!==baseCrit;
      let html=info.innerHTML;
      html=html.replace(/⚔️\d+(<span[^>]*>\(\d+\)<\/span>)?/g,
        atkDiff?`⚔️${act.hero_eff_atk}<span style="font-size:7px;color:#5a4a3a">(${baseAtk})</span>`:`⚔️${act.hero_eff_atk}`);
      html=html.replace(/⚡\d+%(<span[^>]*>\(\d+%\)<\/span>)?/g,
        critDiff?`⚡${act.hero_eff_crit}%<span style="font-size:7px;color:#5a4a3a">(${baseCrit}%)</span>`:`⚡${act.hero_eff_crit}%`);
      info.innerHTML=html;
    }
    // 更新buff标签
    let bf=c.querySelector(".bc-buffs");
    if(bf){
      const tags=[];
      for(let b of act.hero_buffs||[]){
        if(b==="immune")tags.push('<span class="bc-buff ultimate">🛡️免疫</span>');
        else if(b==="atk")tags.push('<span class="bc-buff positive">⚔️+攻</span>');
        else if(b==="dmg_reduce")tags.push('<span class="bc-buff positive">🛡️减伤</span>');
        else if(b==="lifesteal")tags.push('<span class="bc-buff positive">💉吸血</span>');
        else if(b==="reflect")tags.push('<span class="bc-buff positive">🔄反伤</span>');
        else if(b==="spd")tags.push('<span class="bc-buff positive">👟加速</span>');
        else tags.push(`<span class="bc-buff positive">${b}</span>`);
      }
      for(let d of act.hero_debuffs||[]){
        if(d==="burn")tags.push('<span class="bc-buff negative">🔥灼烧</span>');
        else if(d==="stun"||d==="freeze")tags.push('<span class="bc-buff negative">💀眩晕</span>');
        else if(d==="heal_block")tags.push('<span class="bc-buff negative">🚫禁疗</span>');
        else if(d==="atk")tags.push('<span class="bc-buff negative">⬇️攻-</span>');
        else tags.push(`<span class="bc-buff negative">${d}</span>`);
      }
      bf.innerHTML=tags.slice(0,6).join("");
    }
    // 更新🛡️图标
    if(act.hero_buffs&&act.hero_buffs.includes("immune")){
      if(!nm.innerHTML.includes("🛡️"))nm.innerHTML+=' <span class="bc-shield-icon">🛡️</span>';
    }
    break;
  }
}
function updateCardEnergy(act){
  if(act.type==="card_play")return;
  const energy=act.energy_after;
  if(energy===undefined)return;
  // heal侧动作也在我方卡片上显示能量
  const side=act.side==="heal"?"my":"my";
  const myCards=document.querySelectorAll("#bc-my .bc-card");
  for(let c of myCards){
    const nm=c.querySelector(".bc-name");
    if(nm&&nm.textContent.includes(act.attacker_name)){
      const enEl=c.querySelector(".bc-energy-num");
      if(enEl){enEl.textContent="⚡"+energy}
      const efEl=c.querySelector(".bc-energy-fill");
      if(efEl){
        const pct=Math.min(100,(energy/200)*100);
        efEl.style.width=pct+"%";
      }
      c.classList.toggle("bc-energy-ready",energy>=150);
      break;
    }
  }
}

/* ── Hero Skill Spotlight: card zooms center, big damage ── */
function heroSkillSpotlight(act, onDone){
const CI={"战士":"🗡️","肉盾":"🛡️","刺客":"💀","法师":"🔥","射手":"🎯","奶妈":"💚","铁卫":"🛡️","术士":"🔥"};
  const QLTY_COLORS={"凡品":"#888","良品":"#5adb7a","极品":"#4a8eff","绝品":"#b84aff","传说":"#ffd700"};
  const clr=act.attacker_color||"#888";
  const icon=CI[act.attacker_class]||"❓";
  const qlty=act.attacker_quality||"";
  
  // 计算总伤害/治疗（AOE求和，多段则乘以段数）
  let totalDmg=0,totalHeal=0,isHeal=act.side==="heal";
  const mc=act.total_hits||1;
  if(act.aoe&&act.targets){
    act.targets.forEach(t=>{if(t.damage)totalDmg+=t.damage;if(t.heal)totalHeal+=t.heal});
    if(mc>1)totalDmg*=mc;  // 多段AOE: 总伤害=单次×段数
  }else{
    totalDmg=(act.damage||0)*mc;  // 多段ST
    totalHeal=act.heal||0;
  }
  const dmgVal=isHeal?totalHeal:totalDmg;
  
  // 构建特写层
  const overlay=document.createElement("div");overlay.className="hero-spotlight";overlay.id="heroSpotlight";
  const critCls=act.crit?" hs-crit":"";
  const healCls=isHeal?" hs-heal":"";
  const dmgPrefix=isHeal?"+":"-";
  const dmgEmoji=isHeal?"❤️":"💥";
  const qltyStars={"凡品":"★","良品":"★★","极品":"★★★","绝品":"★★★★","传说":"★★★★★"};
  const stars=qltyStars[qlty]||"";
  
  overlay.innerHTML=`
    <div class="hs-card" style="border-color:${clr}">
      <div class="hs-icon" style="color:${clr}">${icon}</div>
      <div class="hs-name" style="color:${clr}">${act.attacker_name||""}</div>
      <div class="hs-class">${act.attacker_class||""}</div>
      <div class="hs-quality" style="color:${QLTY_COLORS[qlty]||clr}">${stars}</div>
      <div class="hs-skill-name">⚡ ${act.skill||""} ⚡</div>
      <div class="hs-dmg${critCls}${healCls}">${dmgEmoji} ${dmgPrefix}${dmgVal}${act.crit?" ⭐":""}</div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  // 播放后移除并回调
  const SPOTLIGHT_DURATION=Math.round(1000/Math.max(1,battleSpeed));
  setTimeout(()=>{
    overlay.classList.add("hs-fadeout");
    setTimeout(()=>{overlay.remove();if(onDone)onDone()},Math.round(300/Math.max(1,battleSpeed)));
  },SPOTLIGHT_DURATION);
}

function renderStatsPanel(st){
  const panel=document.getElementById("battleStatsPanel");
  if(!panel)return;
  // 输出榜
  const dmgSorted=Object.entries(st.dmg).sort((a,b)=>b[1]-a[1]);
  const healSorted=Object.entries(st.heal).sort((a,b)=>b[1]-a[1]);
  const takenSorted=Object.entries(st.taken).sort((a,b)=>b[1]-a[1]);
  const bh=st.bestHit;
  let h=`<div class="stats-col" style="flex:1.5"><div class="stats-col-title">🏆 最强一击</div>`;
  if(bh.val>0)h+=`<div class="stats-best-hit"><div class="sbh-val">${bh.val}</div><div class="sbh-name">${bh.name}</div></div>`;
  else h+=`<div class="sbh-name" style="padding:4px;text-align:center">尚未出手</div>`;
  h+=`<div class="stats-row"><span>⭐暴击</span><span class="sr-val sr-best">${st.crits}次</span></div></div>`;
  // 输出
  h+=`<div class="stats-col"><div class="stats-col-title">⚔️ 输出榜</div>`;
  if(dmgSorted.length){dmgSorted.slice(0,4).forEach(([n,v])=>{h+=`<div class="stats-row"><span class="sr-name">${n}</span><span class="sr-val sr-dmg">${v}</span></div>`})}
  else h+=`<div style="font-size:9px;color:#3a2a3a;text-align:center;padding:4px">暂无</div>`;
  h+=`</div>`;
  // 治疗
  h+=`<div class="stats-col"><div class="stats-col-title">💚 治疗榜</div>`;
  if(healSorted.length){healSorted.slice(0,4).forEach(([n,v])=>{h+=`<div class="stats-row"><span class="sr-name">${n}</span><span class="sr-val sr-heal">+${v}</span></div>`})}
  else h+=`<div style="font-size:9px;color:#3a2a3a;text-align:center;padding:4px">暂无</div>`;
  h+=`</div>`;
  // 扛伤
  h+=`<div class="stats-col"><div class="stats-col-title">🛡️ 扛伤榜</div>`;
  if(takenSorted.length){takenSorted.slice(0,4).forEach(([n,v])=>{h+=`<div class="stats-row"><span class="sr-name">${n}</span><span class="sr-val sr-tank">${v}</span></div>`})}
  else h+=`<div style="font-size:9px;color:#3a2a3a;text-align:center;padding:4px">暂无</div>`;
  h+=`</div>`;
  panel.innerHTML=h;
}

function screenFlash(type){
  if(type==="gold"||!type){sfx("gold");return}
  if(type==="red"){sfx("red");return}
}

function animateAct(act,cb){
  const isAlly=act.side==="ally";let ts=isAlly?"enemy":"my",as=isAlly?"my":"enemy";
  if(act.side==="heal"){ts="my";as="my"}
  const isSkill=act.type==="skill";
  // 快速跳过：目标已全部死亡
  if(act.aoe && act.targets && act.targets.length>0){
    const allDead=act.targets.every(tg=>{
      const tc=document.querySelectorAll(`#bc-${ts} .bc-card`);
      const tcard=tc[Math.min(tg.idx||0,tc.length-1)];
      return tcard&&tcard.classList.contains("bc-dead");
    });
    if(allDead){if(cb)setTimeout(cb,10);return}
  }else if(!act.aoe && (act.damage>0||act.killed)){
    const ti=act.target_idx||0;
    const tc=document.querySelectorAll(`#bc-${ts} .bc-card`);
    const tcard=tc[Math.min(ti,tc.length-1)];
    if(tcard&&tcard.classList.contains("bc-dead")){if(cb)setTimeout(cb,10);return}
  }
  const ai=act.attacker_idx||0;
  const ac=document.querySelectorAll(`#bc-${as} .bc-card`);
  const acard=ac[Math.min(ai,ac.length-1)];

  // ═══ HERO SKILL SPOTLIGHT（我方技能才有特写，多段只有第一次显示）═══
  if(isSkill && (isAlly || act.side==="heal") && (!act.total_hits || act.hit_no===1)){
    heroSkillSpotlight(act, ()=>{
      // 特写结束后，执行目标受击效果（HP条、小伤害数字）
      var _spd=1/Math.max(1,battleSpeed);
      if(act.aoe){
        if(!act.targets||act.targets.length===0){if(cb)setTimeout(cb,10);return}
        act.targets.forEach(tg=>{
          const tc=document.querySelectorAll(`#bc-${ts} .bc-card`);
          const tcard=tc[Math.min(tg.idx||0,tc.length-1)];
          if(!tcard)return;
          if(tg.heal){tcard.classList.add("bc-heal");setTimeout(()=>tcard.classList.remove("bc-heal"),300*_spd)}
          else{tcard.classList.add("bc-hit");tcard.style.transform="translateX(6px)";setTimeout(()=>{tcard.style.transform="";tcard.classList.remove("bc-hit")},250*_spd)}
          const np=Math.max(0,(tg.hp_pct||0)*100);
          const hpEl=document.getElementById(`bchp-${ts}-${tg.idx}`);
          if(hpEl){hpEl.style.width=np+"%";hpEl.style.background=np>50?'#5adb7a':np>25?'#e8b84a':'#e85a5a'}
          if(tg.killed){tcard.classList.add("bc-dead");koPopup();sfx("gold")}
        });
        if(cb)setTimeout(cb,200*_spd);
      }else{
        const ti=act.target_idx||0;
        const tc=document.querySelectorAll(`#bc-${ts} .bc-card`);
        const tcard=tc[Math.min(ti,tc.length-1)];
        if(tcard){
          if(act.side==="heal"){tcard.classList.add("bc-heal");setTimeout(()=>tcard.classList.remove("bc-heal"),300*_spd)}
          else{tcard.classList.add("bc-hit");tcard.style.transform="translateX(6px)";setTimeout(()=>{tcard.style.transform="";tcard.classList.remove("bc-hit")},250*_spd)}
        }
        const hpEl=document.getElementById(`bchp-${ts}-${ti}`);
        if(hpEl&&act.target_hp_pct!==undefined){
          const np=Math.max(0,act.target_hp_pct*100);
          hpEl.style.width=np+"%";hpEl.style.background=np>50?'#5adb7a':np>25?'#e8b84a':'#e85a5a';
        }
        const hpTx=document.getElementById(`bchptxt-${ts}-${ti}`);
        if(hpTx&&act.target_max_hp&&act.target_hp_pct!==undefined){
          hpTx.textContent=`❤️${Math.round(act.target_hp_pct*act.target_max_hp)}`;
        }
        if(act.killed&&tcard){tcard.classList.add("bc-dead");koPopup();sfx("gold")}
        if(cb)setTimeout(cb,150*_spd);
      }
    });
    return;
  }

  // ═══ 非英雄技能（普攻/敌人技能），保持原样 ═══
  var spd=1/Math.max(1,battleSpeed);
  const skillDelay=(isSkill?280:100)*spd;
  const hitDelay=(isSkill?200:80)*spd;

  // ── AOE ──
  if(act.aoe){
    if(!act.targets||act.targets.length===0){
      if(cb)setTimeout(cb,(isSkill?120:50)*spd);return;
    }
    const isHeal=act.side==="heal";
    // 攻击者闪光
    if(acard&&!acard.classList.contains("bc-dead")){
      acard.classList.add("bc-attack");
      setTimeout(()=>{if(acard)acard.classList.remove("bc-attack");},(isSkill?300:150)*spd);
    }
    // skill popup (大号技能版本)
    skillPopup(act.skill,act.side,act.attacker_color||"#ffd700",isSkill);
    // 特效 (技能用增强版)
    if(isHeal){sfxSkill("green");if(isSkill)healBurst(Math.max(...act.targets.map(t=>t.heal||0).filter(v=>v>0),0))}
    else if(isSkill){sfxSkill(act.crit?"gold":"red");document.body.style.animation="shake .3s ease";setTimeout(()=>{document.body.style.animation=""},350*spd)}
    else if(act.crit)sfx("gold");else sfx("red");
    // 目标闪（技能延迟更久）
    setTimeout(()=>{
      act.targets.forEach(tg=>{
        const tc=document.querySelectorAll(`#bc-${ts} .bc-card`);
        const tcard=tc[Math.min(tg.idx||0,tc.length-1)];
        if(!tcard)return;
        if(tg.heal||isHeal){tcard.classList.add("bc-heal");setTimeout(()=>tcard.classList.remove("bc-heal"),(isSkill?600:300)*spd)}
        else{
          tcard.classList.add("bc-hit");
          tcard.style.transform=isSkill?"translateX(8px)":"translateX(4px)";
          setTimeout(()=>{tcard.style.transform="";tcard.classList.remove("bc-hit")},(isSkill?400:250)*spd);
        }
        if(tg.heal||isHeal){
          const d=document.createElement("div");d.className="bc-dmg-num heal-c";
          d.textContent=`+${tg.heal||0}❤️`;tcard.appendChild(d);setTimeout(()=>d.remove(),(isSkill?1400:900)*spd);
        }else if(tg.damage>0){
          const d=document.createElement("div");d.className="bc-dmg-num";
          if(tg.crit)d.classList.add("crit-c");else if(isAlly)d.classList.add("ally-c");else d.classList.add("enemy-c");
          d.textContent=`-${tg.damage}${tg.crit?"⭐":""}`;tcard.appendChild(d);setTimeout(()=>d.remove(),(isSkill?1400:900)*spd);
        }
        const np=Math.max(0,(tg.hp_pct||0)*100);
        const hpEl=document.getElementById(`bchp-${ts}-${tg.idx}`);
        if(hpEl){hpEl.style.width=np+"%";hpEl.style.background=np>50?'#5adb7a':np>25?'#e8b84a':'#e85a5a';setTimeout(()=>{hpEl.style.transition="width .35s ease"},50*spd)}
        if(tg.killed){tcard.classList.add("bc-dead");koPopup();sfx("gold")}
      });
      if(cb)setTimeout(cb,(isSkill?400:200)*spd);
    },skillDelay);
    return;
  }

  // ── Single ──
  const ti=act.target_idx||0;
  const tc=document.querySelectorAll(`#bc-${ts} .bc-card`);
  const tcard=tc[Math.min(ti,tc.length-1)];
  const isHeal=act.side==="heal";
  // 攻击者闪光
  if(acard&&!acard.classList.contains("bc-dead")){
    acard.classList.add("bc-attack");
    setTimeout(()=>{if(acard)acard.classList.remove("bc-attack")},(isSkill?300:100)*spd);
  }
  skillPopup(act.skill,act.side,act.attacker_color||"#ffd700",isSkill);
  if(isHeal){sfxSkill("green");if(isSkill)healBurst(act.heal||0)}
  else if(isSkill){sfxSkill(act.crit?"gold":"red");document.body.style.animation="shake .3s ease";setTimeout(()=>{document.body.style.animation=""},350*spd)}
  else if(act.crit)sfx("gold");else sfx("red");
  // 目标闪
  setTimeout(()=>{
    if(tcard){
      if(isHeal){
        tcard.classList.add("bc-heal");setTimeout(()=>tcard.classList.remove("bc-heal"),(isSkill?600:300)*spd);
      }else{
        tcard.classList.add("bc-hit");
        tcard.style.transform=isSkill?"translateX(8px)":"translateX(6px)";
        setTimeout(()=>{tcard.style.transform="";tcard.classList.remove("bc-hit")},(isSkill?400:250)*spd);
      }
    }
    const hpEl=document.getElementById(`bchp-${ts}-${ti}`);
    if(hpEl&&act.target_hp_pct!==undefined){
      const np=Math.max(0,act.target_hp_pct*100);
      hpEl.style.width=np+"%";hpEl.style.background=np>50?'#5adb7a':np>25?'#e8b84a':'#e85a5a';
    }
    const hpTx=document.getElementById(`bchptxt-${ts}-${ti}`);
    if(hpTx&&act.target_max_hp&&act.target_hp_pct!==undefined){
      hpTx.textContent=`❤️${Math.round(act.target_hp_pct*act.target_max_hp)}`;
    }
    if((act.damage>0||act.heal>0)&&tcard){
      const d=document.createElement("div");d.className="bc-dmg-num";
      if(act.crit)d.classList.add("crit-c");else if(isHeal)d.classList.add("heal-c");else if(isAlly)d.classList.add("ally-c");else d.classList.add("enemy-c");
      d.textContent=isHeal?`+${act.heal||0}❤️`:`-${act.damage||0}${act.crit?"⭐":""}`;
      tcard.appendChild(d);setTimeout(()=>d.remove(),(isSkill?1400:900)*spd);
    }
    if(act.killed&&tcard){tcard.classList.add("bc-dead");koPopup();sfx("gold")}
    if(cb)setTimeout(cb,(isSkill?350:150)*spd);
  },hitDelay);
}

async function apiFetch(url, options){
  const API_BASE = window.location.pathname.startsWith('/wuxia') ? '/wuxia' : '';
  const fullUrl = API_BASE + url;
  if(!options)options={};
  if(options.method==="POST"){
    if(!options.headers)options.headers={"Content-Type":"application/json"};
    if(!options.body)options.body="{}";
  }
  const r=await fetch(fullUrl, options);
  if(r.redirected||r.status===401||r.status===302){window.location.href=API_BASE+"/login";throw new Error("未登录")}
  const txt=await r.text();
  try{const d=JSON.parse(txt);if(d.error){showError(d.error);throw new Error(d.error)};return d}
  catch(e){if(txt.startsWith("<!doctype")){window.location.href=API_BASE+"/login";throw new Error("未登录")};showError("请求失败");throw new Error("解析失败")}
}
function showError(msg){
  const el=document.getElementById("errorToast");if(!el)return;

}

      </div>`;
    }
    h+=`</div>`;
  }
  document.getElementById("tujiContent").innerHTML=h||'<div class="tuji-empty">暂无装备</div>';
}
function showTujiEquip(eid){
  if(!tujiData)return;
  const eq=tujiData.equips.find(e=>e.id===eid);
  if(!eq)return;
  const QC={"凡品":"#888","良品":"#5adb7a","极品":"#4a8eff","绝品":"#b84aff","传说":"#ffd700","神卡":"#ff3333"};
  const QO={"凡品":0,"良品":1,"极品":2,"绝品":3,"传说":4,"神卡":5};
  const col=QC[eq.quality]||'#888';
  const exclName=eq.exclusive_name?`<div style="font-size:11px;color:#ffd700;margin-top:4px">🗡️ ${eq.exclusive_name}专属</div>`:'';
  let milestones='';
  const ms=[{lv:20,desc:eq.lv20},{lv:40,desc:eq.lv40},{lv:60,desc:eq.lv60},{lv:80,desc:eq.lv80},{lv:100,desc:eq.lv100}];
  for(let m of ms){
    if(m.desc)milestones+=`<div class="hd-upgrade" style="color:#4a8eff">Lv${m.lv}: ${m.desc}</div>`;
  }
  const star="★".repeat(Math.min((QO[eq.quality]||0)+1,6));
  const modal=document.getElementById("modal");modal.style.display="flex";
  modal.innerHTML=`<div class="modal-inner">
    <div style="font-size:18px;font-weight:700;color:${col}">${eq.name}</div>
    <div style="font-size:12px;color:${col};margin-bottom:8px">${star}${eq.quality} <span style="font-size:10px;color:#6a5a4a">${eq.type}</span></div>
    <div class="hd-stats">
      <div class="hd-stat"><div>⚔️攻击</div><div class="sv">+${eq.atk}</div></div>
      <div class="hd-stat"><div>❤️血量</div><div class="sv">+${eq.hp}</div></div>
      ${eq.crit?`<div class="hd-stat"><div>⚡暴击</div><div class="sv">+${eq.crit}%</div></div>`:''}
    </div>
    ${exclName}
    ${eq.special?`<div class="hd-section"><div class="hd-section-title">✨ 特效</div><div class="hd-skill" style="color:#5adb7a">${eq.special}</div></div>`:''}
    ${eq.desc?`<div style="font-size:10px;color:#6a5a4a;margin-bottom:6px">📖 ${eq.desc}</div>`:''}
    ${milestones?`<div class="hd-section"><div class="hd-section-title">⬆ 升级解锁</div>${milestones}</div>`:''}
    <div style="text-align:center;margin-top:8px"><button class="pull-btn" onclick="closeModal()">关闭</button></div>
  </div>`;
}
function renderTujiBonds(){
  if(!tujiData||!tujiData.bonds||!tujiData.bonds.length){document.getElementById("tujiContent").innerHTML='<div class="tuji-empty">暂无羁绊</div>';return}
  let h=``;
  for(let b of tujiData.bonds){
    h+=`<div class="tuji-bond-card">
      <div class="tuji-bond-name">🔗 ${b.name}</div>
      <div class="tuji-bond-members">👥 ${b.members.join(" + ")}</div>
      <div class="tuji-bond-effect">✨ ${b.desc}</div>
    </div>`;
  }
  document.getElementById("tujiContent").innerHTML=h;
}
function switchTujiTab(tab){
  ["hero","equip","bond"].forEach(t=>document.getElementById("tujiTab"+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle("active",t===tab));
  if(tab==="hero")renderTujiHeroes();
  else if(tab==="equip")renderTujiEquips();
  else if(tab==="bond")renderTujiBonds();
}
function doLogout(){
  closeModal();closePull();
  const b=window.location.pathname.startsWith('/wuxia')?'/wuxia':'';
  fetch(b+"/api/logout").then(()=>{window.location.href=b+"/login?nocache="+Date.now()}).catch(()=>{window.location.href=b+"/login"});
}
async function doSweep(){
  if(!game||!game.lineup||!game.lineup.length){showError("请先上阵英雄");return}
  document.getElementById("loading").style.display="flex";
  try{const d=await apiFetch("/api/sweep");game=d;if(d.sweep_result){showError(`⚡收菜完成 +${d.sweep_result.total_jade}💎${d.sweep_result.count>0?' +装备':''}`)}render(d)}catch(e){}
  document.getElementById("loading").style.display="none";
}

// ═══ Auto tick & startup ═══
setInterval(async()=>{try{const d=await apiFetch("/api/tick");if(d.tick_gain){document.getElementById("jadeDisplay").textContent=d.jade;if(d.jade_per_min)document.getElementById("jadeRate").textContent=`+${d.jade_per_min}/分`;if(d.dupe_exp_total!==undefined)document.getElementById("expPoolDisplay").textContent=d.dupe_exp_total}}catch(e){}},30000);
(async()=>{const ab=window.location.pathname.startsWith('/wuxia')?'/wuxia':'';try{const r=await fetch(ab+"/api/load");if(r.redirected||r.status===401){window.location.href=ab+"/login";return}const d=await r.json();if(d.need_login){window.location.href=ab+"/login";return}render(d)}catch(e){console.error(e)}finally{document.getElementById("loading").style.display="none"}})();
</script>
