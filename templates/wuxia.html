<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>🏯 江湖经营</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Noto Serif SC",serif;background:#0a0a12;color:#d4c9a8;min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(135deg,#1a1410,#0f0d0a);border-bottom:1px solid #3a3020;padding:8px 14px;position:sticky;top:0;z-index:20}
.header-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
.game-title{font-size:15px;font-weight:700;color:#e8d5a3;letter-spacing:1px}
.res-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:#6a5a4a;flex-wrap:wrap}
.pity-bar{display:flex;gap:2px}
.pity-dot{width:7px;height:7px;border-radius:50%}
.pity-done{background:#5adb7a}.pity-empty{background:#1a1a24;border:1px solid #2a2a3a}
.pity-gold{background:#ffd700;box-shadow:0 0 6px rgba(255,215,0,.5)}
.main{max-width:720px;margin:0 auto;padding:10px 12px 40px}
.msg-box{background:#12100e;border:1px solid #2a2218;border-radius:8px;padding:10px 14px;font-size:12px;color:#c4b89a;margin-bottom:10px;min-height:36px}
.info-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.info-card{flex:1;background:linear-gradient(180deg,#12100e,#0d0b09);border:1px solid #2a2218;border-radius:8px;padding:10px 12px;text-align:center;min-width:100px}
.info-card .l{font-size:10px;color:#6a5a4a}
.info-card .v{font-size:18px;font-weight:700;margin-top:2px}
.info-card .v.gold{color:#ffd700}
.info-card .v.green{color:#5adb7a}
.bond-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.bond-tag{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(90,219,122,.1);border:1px solid rgba(90,219,122,.3);color:#5adb7a}
.bond-empty{font-size:10px;color:#3a2a3a}
.lineup-title{font-size:12px;color:#6a5a4a;margin-bottom:6px}
.lineup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
@media(max-width:500px){.lineup-grid{grid-template-columns:repeat(2,1fr)}}
.hero-card{border-radius:8px;padding:10px;cursor:pointer;transition:all .2s;background:#12100e;min-height:80px;position:relative}
.hero-card:hover{transform:translateY(-2px)}
.hero-card .h-class{font-size:10px;opacity:.7;margin-bottom:1px}
.hero-card .h-name{font-size:14px;font-weight:700}
.hero-card .h-power{font-size:11px;margin-top:4px}
.hero-card .h-lv{position:absolute;top:6px;right:8px;font-size:10px;opacity:.6}
.action-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px}
@media(max-width:400px){.action-row{grid-template-columns:1fr 1fr}}
.action-btn{padding:10px;border-radius:8px;border:1px solid #2a2218;background:linear-gradient(180deg,#12100e,#0d0b09);color:#d4c9a8;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.action-btn:hover{border-color:#5a4a3a;background:#1a1612;transform:translateY(-1px)}
.action-btn.gacha{background:linear-gradient(135deg,#3a2a10,#5a3a10);border-color:#8a6a20;color:#ffd700;font-weight:700}
.action-btn.battle{background:linear-gradient(135deg,#2a1020,#4a1a30);border-color:#8a3a5a;color:#ff8ad8}
.action-btn .ab-icon{font-size:18px;display:block}
.action-btn .ab-label{font-size:10px;opacity:.7}
.inv-section{margin-top:8px}
.inv-toggle{font-size:11px;color:#5a4a3a;cursor:pointer;text-align:center;padding:6px;border:1px dashed #2a2218;border-radius:6px}
.inv-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px;margin-top:6px}
.inv-grid.open{display:grid}
.inv-hero{padding:8px;border-radius:6px;border:1px solid #2a2218;cursor:pointer;font-size:11px;transition:all .15s;background:#12100e}
.inv-hero .iq{font-size:9px;font-weight:700}.inv-hero .in{font-size:12px;font-weight:600}.inv-hero .ip{font-size:10px;color:#5adb7a}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-inner{background:#12100e;border:1px solid #3a3020;border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto}
.hd-title{font-size:18px;font-weight:700}.hd-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.hd-stat{border:1px solid #2a2218;border-radius:6px;padding:6px 10px;font-size:12px;background:#0d0b09}
.hd-stat .sv{font-weight:700;font-size:16px}.hd-section{margin-bottom:10px}
.hd-section-title{font-size:12px;color:#8a7a5a;font-weight:600;margin-bottom:4px;border-bottom:1px solid #2a2218}
.hd-skill{font-size:12px;line-height:1.6}.hd-upgrade{font-size:11px;color:#5adb7a;margin:2px 0;padding:2px 6px;border-left:2px solid #5adb7a}
.equip-slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.equip-slot{border:1px solid #2a2218;border-radius:6px;padding:8px;text-align:center;cursor:pointer;background:#0d0b09;font-size:11px}
.pull-overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300}
.pull-card{text-align:center;animation:pullIn .5s ease}
@keyframes pullIn{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pull-rarity{font-size:16px;font-weight:700;letter-spacing:6px}
.pull-icon{font-size:64px;margin:8px 0}.pull-name{font-size:26px;font-weight:700}
.pull10-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:450px;margin:0 auto}
.pull10-item{text-align:center;padding:8px;border-radius:6px;border:1px solid #2a2218;animation:pullPop .3s ease backwards}
@keyframes pullPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.pull-btn{margin-top:16px;padding:8px 28px;border-radius:8px;border:1px solid #3a3020;background:#1a1410;color:#d4c9a8;font-size:13px;cursor:pointer;font-family:inherit}

/* Battle */
.battle-overlay{position:fixed;inset:0;background:rgba(5,5,10,.96);display:none;flex-direction:column;align-items:center;z-index:250;padding:12px;overflow-y:auto}
.battle-title{font-size:16px;font-weight:700;color:#ffd700;margin:8px 0;text-align:center}
.battle-field{display:flex;gap:12px;justify-content:center;align-items:flex-start;width:100%;max-width:600px;margin:6px 0;flex-wrap:wrap}
.battle-side{flex:1;min-width:140px;max-width:280px}
.battle-side-label{font-size:11px;color:#6a5a4a;margin-bottom:4px;text-align:center}
.bc{display:flex;flex-direction:column;gap:3px}
.bc-card{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;border:1px solid #2a2218;background:#0d0b09;transition:all .3s;font-size:11px;position:relative;min-height:38px}
.bc-card.bc-attack{animation:bcAttack .45s ease;border-color:#ffd700!important;box-shadow:0 0 12px rgba(255,215,0,.4)}
.bc-card.bc-hit{animation:bcHit .3s ease}
.bc-card.bc-heal{animation:bcHeal .4s ease}
.bc-card.bc-dead{opacity:.25}
@keyframes bcAttack{0%{transform:scale(1)}35%{transform:scale(1.06);border-color:#ffd700}100%{transform:scale(1)}}
@keyframes bcHit{0%{border-color:#e85a5a;background:rgba(232,90,90,.15)}100%{border-color:#2a2218;background:#0d0b09}}
@keyframes bcHeal{0%{border-color:#5adb7a;background:rgba(90,219,122,.12);box-shadow:0 0 10px rgba(90,219,122,.3)}100%{border-color:#2a2218;background:#0d0b09}}
.bc-icon{font-size:15px;flex-shrink:0}
.bc-info{flex:1;min-width:0}
.bc-name{font-weight:600;font-size:11px}
.bc-class{font-size:8px;color:#6a5a4a}
.bc-hp-strip{position:relative;height:5px;background:#1a1a24;border-radius:3px;overflow:hidden;margin-top:1px}
.bc-hp-fill{height:100%;border-radius:3px;transition:width .4s ease}
.bc-shield{position:absolute;top:0;right:0;height:100%;background:rgba(74,142,255,.4);border-radius:3px;transition:width .4s ease}
.bc-dmg-num{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-weight:700;font-size:16px;font-family:monospace;pointer-events:none;animation:dmgFloat 1s ease forwards;z-index:10;text-shadow:0 0 6px currentColor}
@keyframes dmgFloat{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-35px) scale(1.3)}}
.bc-dmg-num.ally-c{color:#ff8a4a}.bc-dmg-num.enemy-c{color:#e85a5a}.bc-dmg-num.crit-c{color:#ffd700;font-size:22px}.bc-dmg-num.heal-c{color:#5adb7a;font-size:16px}

/* Buff/Debuff icons */
.bc-status{display:flex;gap:2px;flex-wrap:wrap;margin-top:1px}
.status-icon{font-size:8px;padding:1px 3px;border-radius:2px;font-weight:600}
.status-buff{background:rgba(90,219,122,.15);color:#5adb7a}
.status-debuff{background:rgba(232,90,90,.15);color:#e85a5a}
.aoe-tag{font-size:8px;padding:1px 4px;border-radius:3px;background:rgba(255,215,0,.15);color:#ffd700;font-weight:600;margin-left:4px}

/* Battle log */
.battle-log-t{width:100%;max-width:600px;max-height:100px;overflow-y:auto;margin:4px 0;font-size:10px;color:#8a7a5a;line-height:1.5;padding:4px 8px;background:rgba(0,0,0,.3);border-radius:6px}
.battle-log-t .bl-line{animation:blFade .2s ease}
@keyframes blFade{0%{opacity:0;transform:translateX(-6px)}100%{opacity:1}}
.bl-ally{color:#d4c9a8}.bl-enemy{color:#b86a6a}.bl-heal{color:#5adb7a}
.battle-result{text-align:center;padding:10px;margin-top:6px;border-top:1px solid #2a2218;width:100%;max-width:600px}
.br-title{font-size:20px;font-weight:700;margin:6px 0}
.br-title.win{color:#ffd700}.br-title.lose{color:#e85a5a}
.br-btn{padding:8px 28px;border-radius:8px;border:1px solid #8a7a5a;background:#1a1410;color:#e8d5a3;font-size:13px;cursor:pointer;font-family:inherit}
.vs-text{font-size:22px;font-weight:700;color:#e85a5a;align-self:center;text-shadow:0 0 16px rgba(232,90,90,.3);animation:vsPulse 1.5s ease infinite}
@keyframes vsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.round-indicator{font-size:11px;color:#6a5a4a;text-align:center;padding:3px 0}
.loading{position:fixed;inset:0;background:rgba(10,10,18,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:150}
.loading .spinner{font-size:36px;animation:bounce 1.2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.loading p{color:#8a7a5a;margin-top:10px;font-size:12px}
#errorToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#5a1a1a;border:1px solid #e85a5a;color:#e8a0a0;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:400}
</style></head><body>
<div class="loading" id="loading"><div class="spinner">🏯</div><p>江湖在召唤……</p></div>
<div class="header">
  <div class="header-row">
    <div><span class="game-title">🏯 江湖经营</span> <span id="userDisplay" style="font-size:11px;color:#6a5a4a"></span></div>
    <div class="res-bar">
      <span>💎<span id="jadeDisplay">0</span> <span id="jadeRate" style="font-size:10px;color:#5adb7a"></span></span>
      <span class="pity-bar" id="pityBar"></span>
      <span style="font-size:10px">抽<span id="pullCount">0</span></span>
      <span style="font-size:10px;color:#5a4a3a;cursor:pointer" onclick="doLogout()">退出</span>
    </div>
  </div>
</div>
<div class="battle-overlay" id="battleOverlay">
  <div class="battle-title" id="battleStageName">⚔️ 战斗</div>
  <div class="battle-field" id="battleField"></div>
  <div class="vs-text" id="vsText">⚡ VS ⚡</div>
  <div class="round-indicator" id="roundIndicator"></div>
  <div class="battle-log-t" id="battleLogT"></div>
  <div class="battle-result" id="battleResult" style="display:none"></div>
</div>
<div id="errorToast"></div><div id="modal" class="modal"></div><div id="pullModal" style="display:none"></div>
<div class="main">
  <div class="msg-box" id="msgBox">☯ 江湖经营 · 技能大改版</div>
  <div class="info-row">
    <div class="info-card"><div class="l">阵容战力</div><div class="v gold" id="powerDisplay">0</div></div>
    <div class="info-card" style="cursor:pointer" onclick="startBattle()"><div class="l">当前关卡</div><div class="v green" id="stageDisplay">-</div></div>
    <div class="info-card"><div class="l">关数</div><div class="v" id="stageIndexDisplay">0</div></div>
    <div class="info-card"><div class="l">人数</div><div class="v" id="lineupCount">0/6</div></div>
  </div>
  <div class="bond-bar" id="bondBar"><span class="bond-empty">暂无羁绊</span></div>
  <div class="lineup-title">👥 上阵英雄</div>
  <div class="lineup-grid" id="lineupGrid"></div>
  <div class="action-row">
    <button class="action-btn gacha" onclick="singlePull()"><span class="ab-icon">🎴</span><span class="ab-label">单抽 3💎</span></button>
    <button class="action-btn gacha" onclick="tenPull()"><span class="ab-icon">🎴</span><span class="ab-label">十连 25💎</span></button>
    <button class="action-btn battle" onclick="startBattle()"><span class="ab-icon">⚔️</span><span class="ab-label">挑战</span></button>
    <button class="action-btn" onclick="doSweep()"><span class="ab-icon">⚡</span><span class="ab-label">一键收菜</span></button>
  </div>
  <div class="inv-section">
    <div class="inv-toggle" onclick="toggleInv()">📦 查看全部英雄 (<span id="invTotalCount">0</span>)</div>
    <div class="inv-grid" id="invGrid"></div>
  </div>
</div>

<script>
let game=null;
const QO={"凡品":0,"良品":1,"极品":2,"绝品":3,"传说":4},QC={"凡品":"#888","良品":"#5adb7a","极品":"#4a8eff","绝品":"#b84aff","传说":"#ffd700"},CI={"战士":"🗡️","肉盾":"🛡️","刺客":"💀","法师":"🔥","射手":"🎯","奶妈":"💚"};
const SI={"atk":"⚔️攻","crit":"💥暴","dmg_reduce":"🛡️减","crit_dmg":"🎯爆"};
function qs(q){return "★".repeat(QO[q]+1)}

function render(g){
  if(!g)return;game=g;
  try{
  document.getElementById("jadeDisplay").textContent=g.jade||0;
  document.getElementById("pullCount").textContent=g.pull_count;
  document.getElementById("invTotalCount").textContent=g.inventory_count||0;
  document.getElementById("powerDisplay").textContent = (g.power||0).toLocaleString();
  document.getElementById("stageDisplay").textContent = g.stage?.name||"-";
  const si = document.getElementById("stageIndexDisplay");
  if(si) si.textContent = g.stage?.index!==undefined ? `第${g.stage.index}关` : "0";
  document.getElementById("lineupCount").textContent = g.lineup_count+"/6";
  document.getElementById("msgBox").innerHTML=g.msg||"";
  if(g.username)document.getElementById("userDisplay").textContent=`👤 ${g.username}`;
  if(g.offline_msg){document.getElementById("msgBox").innerHTML=`<span style="color:#ffd700">${g.offline_msg}</span>`;g.offline_msg=""}
  if(g.jade_per_min)document.getElementById("jadeRate").textContent=`+${g.jade_per_min}/分`;
  }catch(e){showError("渲染错误:"+e.message)}

  const p=g.pity||{count:0,next_guaranteed:10};
  document.getElementById("pityBar").innerHTML=`<span style="font-size:9px">保底</span>${
    Array.from({length:10},(_,i)=>i<10-p.next_guaranteed?'<div class="pity-dot pity-done"></div>':i===9?'<div class="pity-dot pity-gold"></div>':'<div class="pity-dot pity-empty"></div>').join("")}`;

  const bb=document.getElementById("bondBar");
  bb.innerHTML=(g.bonds&&g.bonds.length)?g.bonds.map(b=>`<span class="bond-tag">🔗 ${b.name}</span>`).join(""):'<span class="bond-empty">暂无羁绊</span>';

  const lg=document.getElementById("lineupGrid");
  lg.innerHTML=g.lineup.length===0?'<div class="hero-card" style="padding:30px;text-align:center"><div style="color:#3a2a3a">还没有上阵英雄</div></div>':'';
  if(g.lineup.length){
    (async()=>{
      try{
        const r=await fetch("/api/inventory_heroes");const all=await r.json();
        lg.innerHTML="";
        for(let hid of g.lineup){
          const h=all.find(x=>x.hero_id===hid);if(!h)continue;
          const col=h.color||QC[h.quality],ci=CI[h.class]||"❓";
          const card=document.createElement("div");card.className="hero-card";card.style.borderColor=col;
          card.innerHTML=`<div class="h-lv" style="color:${col}">${qs(h.quality)}</div><div class="h-class" style="color:${col}">${ci} ${h.class}</div><div class="h-name">${h.name}</div><div class="h-power" style="color:${col}">⚔️${h.power.toLocaleString()}</div>`;
          card.onclick=(()=>showHeroDetail(hid));lg.appendChild(card);
        }
      }catch(e){}
    })();
  }
}

// ═══ Battle ═══
async function startBattle(){
  if(!game||!game.lineup||!game.lineup.length){showError("请先上阵英雄");return}
  document.getElementById("loading").style.display="flex";
  try{
    const d=await apiFetch("/api/battle");
    game=d;const br=d.battle_result;
    if(!br){showError("战斗异常");document.getElementById("loading").style.display="none";return}
    showBattle(br);
  }catch(e){}
  document.getElementById("loading").style.display="none";
}

function showBattle(br){
  const ov=document.getElementById("battleOverlay");ov.style.display="flex";
  document.getElementById("battleStageName").textContent=`⚔️ 第${game.stage.index}关 · ${game.stage.name}`;
  document.getElementById("battleResult").style.display="none";document.getElementById("roundIndicator").textContent="";
  document.getElementById("vsText").style.display="flex";document.getElementById("battleLogT").innerHTML="";
  renderBF(br.my_heroes,br.enemies,false);
  let ti=0;const aa=br.turns.flatMap(t=>t.actions),total=aa.length;
  function nxt(){
    if(ti>=total){
      document.getElementById("vsText").style.display="none";
      document.getElementById("roundIndicator").textContent="⚔️ 战斗结束";
      renderBF(br.my_heroes,br.enemies,true);
      setTimeout(()=>showBR(br),400);return;
    }
    const act=aa[ti];
    // Log text
    let lt="",lc="bl-line";
    if(act.heal>0){lt=`💚 ${act.attacker_name} 【${act.skill}】 ${act.target_name} ❤️+${act.heal}`;lc+=" bl-heal"}
    else {
      const ct=act.crit?" ⭐":"";const kt=act.killed?" 💀":"";
      const at=act.aoe?"(群攻)":"";
      lt=`${act.side==="ally"?"⚔️":"💀"} ${act.attacker_name} ${act.skill}${at}→${act.target_name} 💥${act.damage}${ct}${kt}`;
      lc+=act.side==="ally"?" bl-ally":" bl-enemy";
    }
    const ld=document.createElement("div");ld.className=lc;ld.textContent=lt;
    document.getElementById("battleLogT").appendChild(ld);
    document.getElementById("battleLogT").scrollTop=document.getElementById("battleLogT").scrollHeight;
    document.getElementById("roundIndicator").textContent=act.side==="ally"?"⚔️ 我方回合":act.side==="heal"?"💚 治疗":"💀 敌方回合";
    animateAct(act,()=>{ti++;setTimeout(nxt,400+(act.killed?200:0))});
  }
  setTimeout(nxt,500);
}

function renderBF(myH,enemies,isFinal){
  const RS=(units,side)=>{
    return `<div class="battle-side"><div class="battle-side-label">${side==="my"?"🛡️ 我方":"💀 敌方"}</div><div class="bc" id="bc-${side}">${
      units.map((u,i)=>{
        const ci=CI[u.class]||"❓";
        const hpPct=isFinal?Math.max(0,(u.hp_pct||0)*100):100;
        const hpCol=hpPct>50?'#5adb7a':hpPct>25?'#e8b84a':'#e85a5a';
        const alive=isFinal?(u.alive!==false):true;
        const shieldPct=isFinal?(u.shield_pct||0)*100:0;
        // Status icons
        let stHTML="";
        const buffs=u.buffs||[];const debuffs=u.debuffs||[];
        if(buffs.length)stHTML+=buffs.map(s=>`<span class="status-icon status-buff">${SI[s]||s}</span>`).join("");
        if(debuffs.length)stHTML+=debuffs.map(s=>`<span class="status-icon status-debuff">${SI[s]||s}</span>`).join("");
        return `<div class="bc-card ${alive?'':'bc-dead'}" id="bc-${side}-${i}" style="border-color:${u.color}">
          <span class="bc-icon">${ci}</span>
          <div class="bc-info">
            <div class="bc-name">${u.name}</div>
            <div class="bc-class">${u.class} <span style="color:${u.color}">${u.quality}</span></div>
            <div style="display:flex;gap:6px;font-size:9px;color:#6a5a4a;margin:1px 0">
              <span>❤️${Math.round((u.max_hp||0)*(isFinal?Math.max(0,u.hp_pct||0):1))}</span>
              <span>⚔️${u.atk||0}</span>
            </div>
            <div class="bc-hp-strip">
              <div class="bc-hp-fill" id="bchp-${side}-${i}" style="width:${hpPct}%;background:${hpCol}"></div>
              ${shieldPct>0?`<div class="bc-shield" style="width:${shieldPct}%"></div>`:""}
            </div>
            ${stHTML?`<div class="bc-status">${stHTML}</div>`:""}
          </div>
        </div>`;
      }).join("")}</div></div>`;
  };
  document.getElementById("battleField").innerHTML=RS(myH,"my")+RS(enemies,"enemy");
  document.getElementById("vsText").style.display="flex";
}

function animateAct(act,cb){
  const isAlly=act.side==="ally";let ts=isAlly?"enemy":"my",as=isAlly?"my":"enemy";
  if(act.side==="heal"){ts="my";as="my"}
  const ti=act.target_idx||0,ai=act.attacker_idx||0;
  const ac=document.querySelectorAll(`#bc-${as} .bc-card`),tc=document.querySelectorAll(`#bc-${ts} .bc-card`);
  const acard=ac[Math.min(ai,ac.length-1)],tcard=tc[Math.min(ti,tc.length-1)];
  if(acard&&!acard.classList.contains("bc-dead")){acard.classList.add("bc-attack")}
  setTimeout(()=>{
    if(acard)acard.classList.remove("bc-attack");
    if(tcard){
      if(act.heal>0)tcard.classList.add("bc-heal");
      else tcard.classList.add("bc-hit");
    }
    const hpEl=document.getElementById(`bchp-${ts}-${ti}`);
    if(hpEl){const np=Math.max(0,(act.target_hp_pct||0)*100);hpEl.style.width=np+"%";hpEl.style.background=np>50?'#5adb7a':np>25?'#e8b84a':'#e85a5a'}
    if((act.damage>0||act.heal>0)&&tcard){
      const d=document.createElement("div");d.className="bc-dmg-num";
      if(act.crit)d.classList.add("crit-c");else if(act.heal>0)d.classList.add("heal-c");else if(isAlly)d.classList.add("ally-c");else d.classList.add("enemy-c");
      d.textContent=act.heal>0?`+${act.heal}`:`-${act.damage}${act.crit?"⭐":""}`;
      tcard.appendChild(d);setTimeout(()=>d.remove(),1000);
    }
    // Reflect text
    if(act.reflect_dmg){
      const rt=document.getElementById("battleLogT");
      if(rt)rt.innerHTML+=`<div class="bl-line bl-enemy" style="color:#ff8a4a">🪞 ${act.attacker_name} 受到反伤 ${act.reflect_dmg}</div>`;
    }
    if(act.lifesteal&&tcard){
      const lt=document.getElementById("battleLogT");
      if(lt)lt.innerHTML+=`<div class="bl-line bl-heal" style="color:#e8b84a">🩸 ${act.attacker_name} 吸血 ${act.lifesteal}</div>`;
    }
    if(act.killed&&tcard)tcard.classList.add("bc-dead");
    if(cb)setTimeout(cb,200);
  },300);
}

function showBR(br){
  const rd=document.getElementById("battleResult");rd.style.display="block";
  document.getElementById("roundIndicator").textContent="";
  const win=br.win,jr=br.jade_reward||0,eq=br.equip_reward;
  let lh=`<span>💎+${jr}</span>`;
  if(eq)lh+=`<span style="color:${eq.color};margin-left:8px">${eq.type==="武器"?"🗡️":eq.type==="防具"?"🛡️":"💍"} ${eq.name}</span>`;
  if(br.new_stage)lh+=`<span style="color:#5adb7a;margin-left:8px">➡️${br.new_stage}</span>`;
  rd.innerHTML=`<div class="br-title ${win?'win':'lose'}">${win?'🏆胜利':'💀败北'}</div><div style="font-size:11px;color:#6a5a4a">${br.rounds||1}回合</div><div style="margin:8px 0;font-size:13px">${lh}</div><button class="br-btn" onclick="closeBattle();render(game)">继续</button>`;
  render(game);
}
function closeBattle(){document.getElementById("battleOverlay").style.display="none"}

// ═══ Hero Detail ═══
async function showHeroDetail(hid){
  document.getElementById("loading").style.display="flex";
  try{
    const h=await apiFetch(`/api/hero_detail/${hid}`);
    if(h.error){showError(h.error);document.getElementById("loading").style.display="none";return}
    const col=h.color||QC[h.quality],ci=CI[h.class]||"❓";
    let skUp=Object.entries(h.skill_upgrades||{}).map(([lv,desc])=>`<div class="hd-upgrade" style="color:${parseInt(lv)<=h.skill_lv?'#5adb7a':'#3a2a3a'}">${parseInt(lv)<=h.skill_lv?'🔓':'🔒'}Lv${lv}:${desc}</div>`).join("");
    let paUp=Object.entries(h.passive_upgrades||{}).map(([lv,desc])=>`<div class="hd-upgrade" style="color:${parseInt(lv)<=h.skill_lv?'#5adb7a':'#3a2a3a'}">${parseInt(lv)<=h.skill_lv?'🔓':'🔒'}Lv${lv}:${desc}</div>`).join("");
    const eq=h.equipped||{};
    let eqH=["武器","防具","饰品"].map(s=>{
      const e=eq[s];
      return e?`<div class="equip-slot" onclick="showEquipSel('${h.hero_id}','${s}')" style="border-color:${e.color}"><div style="font-weight:600;font-size:12px;color:${e.color}">${e.name}</div>${e.exclusive?'<div style="font-size:9px;color:#ffd700">✓专武</div>':''}</div>`
        :`<div class="equip-slot" onclick="showEquipSel('${h.hero_id}','${s}')"><div class="es-empty" style="color:#3a2a3a">空</div></div>`;
    }).join("");
    const aoeTag=h.skill_aoe?'<span style="font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(255,215,0,.15);color:#ffd700;font-weight:600;margin-left:6px">群攻</span>':'';
    const modal=document.getElementById("modal");modal.style.display="flex";
    modal.innerHTML=`<div class="modal-inner">
      <div style="font-size:18px;font-weight:700;color:${col}">${h.name} ${ci} ${h.class}</div>
      <div style="font-size:12px;color:${col};margin-bottom:10px">${qs(h.quality)} ${h.quality}</div>
      <div class="hd-stats">
        <div class="hd-stat"><div>❤️血量</div><div class="sv">${h.hp.toLocaleString()}</div></div>
        <div class="hd-stat"><div>💥攻击</div><div class="sv">${h.atk.toLocaleString()}</div></div>
        <div class="hd-stat"><div>⚡暴击</div><div class="sv">${h.crit}%</div></div>
        <div class="hd-stat"><div>⚔️战力</div><div class="sv" style="color:${col}">${h.power.toLocaleString()}</div></div>
      </div>
      <div class="hd-section"><div class="hd-section-title">📜 ${h.skill_name}${aoeTag} <span style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:${col};color:#000;margin-left:4px">Lv${h.skill_lv}</span></div>
        <div class="hd-skill">${h.skill_desc}</div>${skUp}</div>
      <div class="hd-section"><div class="hd-section-title">⭐ ${h.passive_name}</div><div class="hd-skill" style="color:#6a5a4a">${h.passive_desc}</div>${paUp}</div>
      <div class="hd-section"><div class="hd-section-title">🛡️装备</div><div class="equip-slots">${eqH}</div></div>
      <div style="text-align:center;margin-top:8px;display:flex;gap:6px;justify-content:center">
        <button class="pull-btn" onclick="toggleLU('${h.hero_id}')">🔄 ${h.in_lineup?'下阵':'上阵'}</button>
        <button class="pull-btn" onclick="closeModal()">关闭</button>
      </div>
    </div>`;
  }catch(e){}
  document.getElementById("loading").style.display="none";
}

// ═══ Misc ═══
async function toggleLU(hid){
  closeModal();document.getElementById("loading").style.display="flex";
  try{const d=await apiFetch(`/api/lineup/${hid}`);render(d)}catch(e){}
  document.getElementById("loading").style.display="none";
}
async function showEquipSel(hid,slot){
  document.getElementById("loading").style.display="flex";
  try{
    const bag=await apiFetch("/api/equip_bag");
    const fl=bag.filter(e=>e.type===slot);
    const m=document.getElementById("modal");m.style.display="flex";
    m.innerHTML=`<div class="modal-inner"><div style="font-size:14px;font-weight:700;margin-bottom:10px">🔧选择${slot}</div>
      ${fl.length===0?'<div style="color:#3a2a3a;padding:12px;text-align:center">没该类装备</div>':''}
      <div style="display:grid;gap:4px">${fl.map(e=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;border:1px solid ${e.color};cursor:pointer;font-size:11px;background:#0d0b09" onclick="doEquip2('${hid}','${slot}','${e.id}')"><div><span style="font-weight:600;color:${e.color}">${e.name}</span><span style="font-size:9px;color:#6a5a4a">×${e.count}</span></div><div>⚔️+${e.atk}❤️+${e.hp}</div></div>`).join("")}</div>
      <div style="margin-top:4px"><div class="pull-btn" onclick="doEquip2('${hid}','${slot}','none')" style="display:inline-block">卸下</div></div>
      <div style="text-align:center;margin-top:8px"><button class="pull-btn" onclick="closeModal()">取消</button></div>
    </div>`;
  }catch(e){}
  document.getElementById("loading").style.display="none";
}
async function doEquip2(hid,slot,eid){
  document.getElementById("loading").style.display="flex";
  try{const d=await apiFetch(`/api/equip/${hid}/${slot}/${eid}`);closeModal();render(d)}catch(e){}
  document.getElementById("loading").style.display="none";
}
async function singlePull(){
  if(!game)return;document.getElementById("loading").style.display="flex";
  try{const d=await apiFetch("/api/pull");render(d);if(d.pull)showPullM(d.pull,false)}catch(e){}
  document.getElementById("loading").style.display="none";
}
async function tenPull(){
  if(!game)return;document.getElementById("loading").style.display="flex";
  try{const d=await apiFetch("/api/pull10");render(d);if(d.pull)showPullM(d.pull,true)}catch(e){}
  document.getElementById("loading").style.display="none";
}
function showPullM(pull,is10){
  const pm=document.getElementById("pullModal");pm.style.display="flex";
  if(is10&&Array.isArray(pull)){
    const s=[...pull].sort((a,b)=>QO[b.quality]-QO[a.quality]);
    pm.innerHTML=`<div class="pull-overlay" onclick="closePull()"><div style="margin-bottom:10px;text-align:center"><span style="font-size:18px;font-weight:700;color:#ffd700">✨十连</span></div>
      <div class="pull10-grid">${s.map((c,i)=>{const col=QC[c.quality]||"#888",ci=CI[c.hero_class]||"❓";return `<div class="pull10-item" style="border-color:${col};animation-delay:${i*0.06}s"><div class="p10-r" style="color:${col}">${c.quality}</div><span class="p10-i" style="color:${col}">${ci}</span><div class="p10-n">${c.hero_name}</div></div>`}).join("")}</div>
      <div style="text-align:center;margin-top:10px"><button class="pull-btn" onclick="closePull()">继续</button></div></div>`;
  }else if(pull){
    const col=QC[pull.quality]||"#888",ci=CI[pull.hero_class]||"🎴";
    pm.innerHTML=`<div class="pull-overlay" style="cursor:pointer" onclick="closePull()"><div class="pull-card"><div class="pull-rarity" style="color:${col}">✦${pull.quality}✦</div><div class="pull-icon" style="color:${col}">${ci}</div><div class="pull-name" style="color:${col}">${pull.hero_name}</div></div><div style="margin-top:6px;font-size:11px;color:#5a4a3a">点击继续</div></div>`;
  }
}
function closePull(){document.getElementById("pullModal").style.display="none";if(game)render(game)}
async function toggleInv(){
  const g=document.getElementById("invGrid");g.classList.toggle("open");
  if(g.classList.contains("open")){
    document.getElementById("loading").style.display="flex";
    try{
      const list=await apiFetch("/api/inventory_heroes");
      g.innerHTML=list.map(h=>{
        const col=h.color||QC[h.quality],inL=h.in_lineup;
        return `<div class="inv-hero" onclick='invClick({hero_id:"${h.hero_id}",in_lineup:${inL}})' style="border-color:${inL?col:"#2a2218"};opacity:${inL?1:.7}">
          <div class="iq" style="color:${col}">${h.quality} ${h.class}</div><div class="in">${h.name}</div><div class="ip">⚔️${h.power.toLocaleString()}</div>
        </div>`;
      }).join("");
    }catch(e){}
    document.getElementById("loading").style.display="none";
  }
}
function invClick(h){if(h.in_lineup)showHeroDetail(h.hero_id);else toggleLU(h.hero_id)}
async function doSweep(){
  document.getElementById("loading").style.display="flex";
  try{const d=await apiFetch("/api/sweep");render(d);if(d.sweep_result){const r=d.sweep_result;document.getElementById("msgBox").innerHTML=`⚡扫荡${r.count}次·💎+${r.total_jade}`}}catch(e){}
  document.getElementById("loading").style.display="none";
}
function doLogout(){fetch("/api/logout").then(()=>window.location.href="/login")}
async function apiFetch(url,opts={}){
  const r=await fetch(url,opts);
  if(r.redirected||r.status===401){window.location.href="/login";throw new Error("auth")}
  const d=await r.json();
  if(d&&d.need_login){window.location.href="/login";throw new Error("auth")}
  return d;
}
function closeModal(){document.getElementById("modal").style.display="none"}
function showError(m){const t=document.getElementById("errorToast");if(!t)return;t.textContent="❌"+m;t.style.display="block";setTimeout(()=>t.style.display="none",3000)}

setInterval(async()=>{
  try{const d=await apiFetch("/api/tick");if(d.tick_gain){document.getElementById("jadeDisplay").textContent=d.jade;if(d.jade_per_min)document.getElementById("jadeRate").textContent=`+${d.jade_per_min}/分`}}catch(e){}
},30000);

(async()=>{
  try{const r=await fetch("/api/load");if(r.redirected||r.status===401){window.location.href="/login";return}const d=await r.json();if(d.need_login){window.location.href="/login";return}render(d)}catch(e){window.location.href="/login"}
  document.getElementById("loading").style.display="none";
})();
</script></body></html>
